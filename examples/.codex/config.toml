# .codex/config.toml — Configuración de proyecto para Codex CLI
# Documentación: https://developers.openai.com/codex/configuration

model = "gpt-5.3-codex"
approval_mode = "suggest"          # Modo seguro: siempre pedir aprobación

[sandbox]
allow_network = true
allowed_hosts = [
    "registry.npmjs.org",
    "api.github.com",
    "github.com",
    "sts.amazonaws.com",            # Para verificar identidad AWS
    "ec2.amazonaws.com",
    "s3.amazonaws.com",
    "cloudwatch.amazonaws.com",
]

# ─── MCP Servers ───────────────────────────────────────────────

[mcp.servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}" }

[mcp.servers.aws]
command = "npx"
args = ["-y", "mcp-server-aws"]
env = { AWS_PROFILE = "${AWS_PROFILE:-codex-staging}", AWS_REGION = "${AWS_REGION:-us-east-1}" }

